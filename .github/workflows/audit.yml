name: Audit parkwalker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit.yml'
      - 'parkwalker.csv'
      - 'collect.py'
      - 'discover.py'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: parkwalker-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe live parkrun access
        run: python preflight.py
      - name: Verify CSV is ready
        shell: bash
        run: |
          test -f parkwalker.csv || { echo 'Missing parkwalker.csv'; exit 1; }
      - name: Run multiple batches and checkpoint after each batch
        env:
          AUDIT_LIMIT: '60'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          start=$SECONDS
          for round in $(seq 1 40); do
            if [ -f audit_complete.json ]; then
              echo 'HISTORICAL AUDIT ALREADY COMPLETE; stopping.'
              break
            fi
            pending=$(python -c 'import csv; print(sum(r["Статус"]=="НЕ ПРОВЕРЕНО" for r in csv.DictReader(open("parkwalker.csv",encoding="utf-8-sig"),delimiter=";")))')
            echo "ROUND $round: remaining $pending"
            if [ "$pending" -eq 0 ]; then
              echo 'CURRENT QUEUE DONE; discover more historical events.'
            fi
            if [ "$((SECONDS-start))" -ge 18000 ]; then
              echo 'Time budget reached; next scheduled or manual run will continue.'
              break
            fi
            if [ "$pending" -gt 0 ]; then
              python collect.py || echo 'Collector reported an error; saving available checkpoint.'
            fi
            python discover.py || echo 'Discovery reported an error; saving available checkpoint.'
            git add parkwalker.csv
            for file in attempts.json venues.json discovery_state.json audit_complete.json; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint parkwalker round $round"
              git push
            fi
          done
          python -c 'import csv,collections; r=list(csv.DictReader(open("parkwalker.csv",encoding="utf-8-sig"),delimiter=";")); print("FINAL SUMMARY:",len(r),dict(collections.Counter(x["Статус"] for x in r)))'
          if [ -f audit_complete.json ]; then echo 'ONE-TIME HISTORICAL AUDIT FINISHED'; fi
